name: Build (Windows, not shipped)

# MANUAL ONLY — this deliberately does NOT run on version tags, and it does NOT
# publish anything to a release.
#
# The Windows app transcribes in the CLOUD: it POSTs raw microphone audio to
# OpenRouter (windows/app/core.py). Voicely's whole pitch is the opposite —
# README.md promises "your audio never leaves" and "no audio upload" — so
# shipping this binary under the Voicely name made the product's central claim
# untrue for anyone who installed it. It did ship: VoicelySetup.exe rode the
# v0.2.0 release and was downloaded 3 times before being pulled on 2026-07-16.
#
# It stays buildable so the code doesn't rot, and so its tests still run on
# demand. Before it can ship again it needs on-device transcription (see
# platforms/README.md — the intended Windows path is Tauri + Rust with a local
# engine, not this Python prototype).
#
# DO NOT add a tag trigger or a release step back without fixing that first.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt pyinstaller pytest

      - name: Unit tests (core logic on Windows)
        run: python -m pytest tests -q

      - name: Import smoke (all runtime deps load on Windows)
        run: python tests/import_smoke.py

      - name: Generate icon
        run: python app/gen_icon.py

      - name: Build executable (PyInstaller)
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name Voicely
          --icon app/icon.ico
          --collect-all sounddevice
          --collect-all pystray
          --collect-all pyperclip
          --hidden-import pystray._win32
          --hidden-import PIL.ImageDraw
          app/main.py

      - name: Smoke test the built exe (boots without crashing on Windows)
        shell: pwsh
        run: |
          $dir = "$env:APPDATA\Voicely"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          '{"openrouter_key":"sk-or-smoketest"}' | Set-Content -Encoding utf8 "$dir\config.json"
          Remove-Item "$dir\log.txt" -ErrorAction SilentlyContinue
          $env:VOICELY_SMOKE = "1"
          $p = Start-Process -FilePath "dist\Voicely.exe" -PassThru -Wait
          Write-Host "exit code: $($p.ExitCode)"
          $log = ""
          if (Test-Path "$dir\log.txt") { $log = Get-Content "$dir\log.txt" -Raw }
          Write-Host "---- app log ----"
          Write-Host $log
          if ($p.ExitCode -ne 0) { Write-Error "Voicely.exe exited non-zero"; exit 1 }
          if ($log -notmatch "SMOKE OK") { Write-Error "Voicely.exe did not reach SMOKE OK (startup crash)"; exit 1 }
          Write-Host "SMOKE PASSED: the frozen app boots and wires up on Windows."

      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      # A CI artifact, not a release asset: it needs repo access to download and
      # it expires. Deliberately nothing publishes this to a release — see the
      # note at the top of this file.
      - name: Upload installer artifact (internal only)
        uses: actions/upload-artifact@v4
        with:
          name: VoicelySetup
          path: windows/installer_out/VoicelySetup.exe
